<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BananaGPT</title>
<meta name="description" content="Chat with BananaGPT, a small AI built from scratch by Jordan Valladares. It runs right in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>">
<style>
  :root {
    --bg: #fffbea;
    --panel: #ffffff;
    --ink: #2b2410;
    --muted: #7a6c45;
    --line: #f0e3b0;
    --accent: #f5c518;
    --accent-ink: #3a2c00;
    --me: #2b2410;
    --me-ink: #fff8dc;
    --bot: #fff3c4;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140a;
      --panel: #211d10;
      --ink: #f6eed2;
      --muted: #b3a576;
      --line: #3a331b;
      --accent: #f5c518;
      --accent-ink: #2a2000;
      --me: #f5c518;
      --me-ink: #2a2000;
      --bot: #2c2612;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 12px;
    padding-top: max(14px, env(safe-area-inset-top));
  }
  .logo { font-size: 30px; line-height: 1; }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .title p { margin: 0; font-size: 13px; color: var(--muted); }
  .icon-btn {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 10px; padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .intro {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; text-align: center; margin-top: 8vh;
  }
  .intro .big { font-size: 56px; line-height: 1; }
  .intro h2 { margin: 10px 0 6px; font-size: 22px; }
  .intro p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    padding: 12px 18px; font-weight: 650; font-size: 16px; cursor: pointer;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; display: none; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .status { font-size: 13px; color: var(--muted); min-height: 20px; }
  .small { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .msg { display: flex; margin: 10px 0; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word;
  }
  .me .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 6px; }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  form { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 14px; padding: 11px 14px; font: inherit; font-size: 16px; max-height: 140px; min-height: 46px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { height: 46px; min-width: 64px; }
  .hidden { display: none !important; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">🍌</div>
  <div class="title">
    <h1>BananaGPT</h1>
    <p id="sub">Made from scratch by Jordan Valladares</p>
  </div>
  <button class="icon-btn hidden" id="clear" type="button">New chat</button>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <div class="intro" id="intro">
      <div class="big">🍌</div>
      <h2>Chat with BananaGPT</h2>
      <p>A small AI built from scratch by Jordan Valladares. It runs entirely on your device, so nothing you type is sent anywhere.</p>
      <button class="btn" id="load" type="button">Start BananaGPT</button>
      <div class="bar" id="bar"><div id="fill"></div></div>
      <div class="status" id="status"></div>
      <div class="small" id="info">Loading…</div>
    </div>
  </div>
</main>

<footer class="hidden" id="footer">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message BananaGPT" enterkeyhint="send"></textarea>
    <button class="btn send" id="send" type="submit">Send</button>
  </form>
</footer>

<script type="module">
import { Wllama } from './wllama/index.js';

const $ = (id) => document.getElementById(id);
let manifest = null;
let wllama = null;
let history = [];
let busy = false;
let abort = null;

function fmtMB(bytes) { return Math.round(bytes / 1e6) + ' MB'; }

async function init() {
  try {
    manifest = await (await fetch('model/manifest.json', { cache: 'no-store' })).json();
    $('info').textContent = `${manifest.label} · ${fmtMB(manifest.bytes)} download (only the first time)`;
  } catch (e) {
    $('info').textContent = 'The model is not published yet. Check back soon!';
    $('load').disabled = true;
  }
}

async function load() {
  $('load').disabled = true;
  $('bar').style.display = 'block';
  $('status').textContent = 'Downloading BananaGPT…';
  try {
    wllama = new Wllama({ default: './wllama/wasm/wllama.wasm' });
    // pass the first piece; the engine finds the other pieces of the split model itself
    const url = new URL('model/' + manifest.files[0], location.href).href;
    await wllama.loadModelFromUrl({ url }, {
      n_ctx: manifest.n_ctx,
      progressCallback: ({ loaded, total }) => {
        const pct = total ? Math.round((loaded / total) * 100) : 0;
        $('fill').style.width = pct + '%';
        $('status').textContent = pct < 100 ? `Downloading BananaGPT… ${pct}%` : 'Starting up…';
      },
    });
    $('intro').remove();
    $('footer').classList.remove('hidden');
    $('clear').classList.remove('hidden');
    addMsg('bot', "Hi! I'm BananaGPT. What would you like to talk about? 🍌");
    $('input').focus();
  } catch (e) {
    console.error(e);
    $('status').innerHTML = '<span class="err">Something went wrong loading the model. Try refreshing the page.</span>';
    $('load').disabled = false;
  }
}

function addMsg(who, text) {
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  $('chat').appendChild(row);
  $('main').scrollTop = $('main').scrollHeight;
  return b;
}

// keep the conversation short enough to fit the model's memory
function trimmedHistory() {
  const budget = manifest.n_ctx * 2.4;  // rough characters per context
  const out = [];
  let size = 0;
  for (let i = history.length - 1; i >= 0; i--) {
    size += history[i].content.length + 20;
    if (size > budget && out.length) break;
    out.unshift(history[i]);
  }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

async function send(text) {
  busy = true;
  $('send').textContent = 'Stop';
  addMsg('me', text);
  history.push({ role: 'user', content: text });
  const bubble = addMsg('bot', '');
  bubble.classList.add('typing');
  let reply = '';
  abort = new AbortController();
  try {
    await wllama.createChatCompletion({
      messages: trimmedHistory(),
      max_tokens: 200,
      temp: 0.7, top_k: 40, top_p: 0.9, min_p: 0.05,
      penalty_repeat: 1.1, penalty_last_n: 64,
      stream: true,
      abortSignal: abort.signal,
      onData: (chunk) => {
        const piece = chunk.choices?.[0]?.delta?.content;
        if (piece) {
          reply += piece;
          bubble.textContent = reply;
          $('main').scrollTop = $('main').scrollHeight;
        }
      },
    });
  } catch (e) {
    if (e?.name !== 'AbortError') console.error(e);
  }
  bubble.classList.remove('typing');
  reply = reply.trim();
  if (!reply) { reply = '…'; bubble.textContent = reply; }
  history.push({ role: 'assistant', content: reply });
  busy = false;
  abort = null;
  $('send').textContent = 'Send';
}

$('load').addEventListener('click', load);
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy) { abort?.abort(); return; }
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  $('input').style.height = '';
  send(text);
});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
});
$('input').addEventListener('input', () => {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 140) + 'px';
});
$('clear').addEventListener('click', () => {
  if (busy) abort?.abort();
  history = [];
  document.querySelectorAll('.msg').forEach((m) => m.remove());
  addMsg('bot', "New chat! What's on your mind? 🍌");
});

init();
</script>
</body>
</html>
