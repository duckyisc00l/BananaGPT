<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>BananaGPT</title>
<meta name="description" content="Chat with BananaGPT, a small AI built from scratch by Jordan Valladares. It runs right in your browser.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --ink: #0d0d0d;
    --muted: #6b6b6b;
    --soft: #f4f4f4;
    --line: #e5e5e5;
    --composer: #ffffff;
    --composer-line: #e3e3e3;
    --btn: #0d0d0d;
    --btn-ink: #ffffff;
    --btn-off: #d7d7d7;
    --chip: #ffffff;
    --accent: #f5c518;
    --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --ink: #ececec;
      --muted: #a5a5a5;
      --soft: #303030;
      --line: #3a3a3a;
      --composer: #303030;
      --composer-line: #3a3a3a;
      --btn: #ffffff;
      --btn-ink: #0d0d0d;
      --btn-off: #676767;
      --chip: #212121;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* top bar */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--bg); position: sticky; top: 0; z-index: 2;
  }
  .model {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px;
    font-size: 18px; font-weight: 600; background: transparent; border: 0; cursor: default;
  }
  .model small { font-weight: 400; color: var(--muted); font-size: 15px; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent;
    display: grid; place-items: center; cursor: pointer; color: var(--ink);
  }
  .iconbtn:hover { background: var(--soft); }
  .iconbtn svg { width: 22px; height: 22px; }

  /* conversation */
  main { flex: 1; overflow-y: auto; }
  .col { max-width: 768px; margin: 0 auto; padding: 0 16px; }
  .thread { padding-top: 8px; padding-bottom: 24px; }
  .turn { margin: 22px 0; }
  .turn.user { display: flex; justify-content: flex-end; }
  .turn.user .text {
    background: var(--soft); padding: 10px 18px; border-radius: 22px; max-width: 80%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .turn.bot { display: flex; gap: 14px; align-items: flex-start; }
  .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 16px; margin-top: 1px;
  }
  .turn.bot .text { flex: 1; min-width: 0; white-space: pre-wrap; word-wrap: break-word; padding-top: 2px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ink);
         vertical-align: middle; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1); opacity: 1; } }

  /* empty state */
  .hero {
    min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px 16px 40px; text-align: center;
  }
  .hero h1 { font-size: 28px; font-weight: 600; margin: 0 0 22px; letter-spacing: -0.01em; }
  .loadcard {
    width: 100%; max-width: 520px; border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
    text-align: left; display: flex; gap: 14px; align-items: center;
  }
  .loadcard .avatar { width: 40px; height: 40px; font-size: 22px; }
  .loadcard .info { flex: 1; min-width: 0; }
  .loadcard b { display: block; font-weight: 600; }
  .loadcard span { font-size: 14px; color: var(--muted); }
  .pill {
    flex: none; border: 0; background: var(--btn); color: var(--btn-ink); border-radius: 999px;
    padding: 8px 16px; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .pill:disabled { opacity: .5; cursor: default; }
  .progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; max-width: 560px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 8px 14px;
    font-size: 14px; color: var(--muted); cursor: pointer;
  }
  .chip:hover { background: var(--soft); color: var(--ink); }
  .chip:disabled { opacity: .5; cursor: default; }

  /* composer */
  footer { padding: 0 0 max(10px, env(safe-area-inset-bottom)); background: var(--bg); }
  .composer {
    display: flex; align-items: flex-end; gap: 8px; background: var(--composer);
    border: 1px solid var(--composer-line); border-radius: 28px; padding: 8px 8px 8px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; line-height: 24px; padding: 8px 0; max-height: 200px; min-height: 40px;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--btn); color: var(--btn-ink); cursor: pointer; margin-bottom: 2px;
  }
  .send:disabled { background: var(--btn-off); cursor: default; }
  .send svg { width: 18px; height: 18px; }
  .disclaimer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 12px 0; }
  .hidden { display: none !important; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="model">BananaGPT <small id="version"></small></div>
  <button class="iconbtn" id="newchat" type="button" title="New chat" aria-label="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  </button>
</header>

<main id="main">
  <section class="hero" id="hero">
    <h1>What can I help with?</h1>
    <div class="loadcard" id="loadcard">
      <div class="avatar" aria-hidden="true">🍌</div>
      <div class="info">
        <b>BananaGPT</b>
        <span id="status">Checking for the model…</span>
        <div class="progress" id="progress"><div id="fill"></div></div>
      </div>
      <button class="pill" id="load" type="button" disabled>Start</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button" disabled>Who made you?</button>
      <button class="chip" type="button" disabled>Tell me a story about a dog</button>
      <button class="chip" type="button" disabled>Tell me a joke</button>
      <button class="chip" type="button" disabled>Give me a fun fact</button>
    </div>
  </section>
  <div class="col thread hidden" id="thread"></div>
</main>

<footer>
  <div class="col">
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Message BananaGPT" enterkeyhint="send" disabled></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        <svg id="icon-stop" class="hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
      </button>
    </form>
    <div class="disclaimer">BananaGPT is a small AI made by Jordan Valladares and can make mistakes. It runs on your device.</div>
  </div>
</footer>

<script type="module">
import { Wllama } from './wllama/index.js';

const $ = (id) => document.getElementById(id);
let manifest = null, wllama = null, history = [], busy = false, abort = null, ready = false;

const mb = (b) => Math.round(b / 1e6) + ' MB';

async function init() {
  try {
    manifest = await (await fetch('model/manifest.json', { cache: 'no-store' })).json();
    $('version').textContent = manifest.label.replace(/[()]/g, '');
    $('status').textContent = `${mb(manifest.bytes)} download, only the first time`;
    $('load').disabled = false;
  } catch (e) {
    $('status').textContent = 'Not published yet. Check back soon!';
  }
}

async function load() {
  if (ready || !manifest) return;
  $('load').disabled = true;
  $('load').textContent = '…';
  $('progress').style.display = 'block';
  try {
    wllama = new Wllama({ default: './wllama/wasm/wllama.wasm' });
    // pass the first piece; the engine finds the other pieces of the split model itself
    const url = new URL('model/' + manifest.files[0], location.href).href;
    await wllama.loadModelFromUrl({ url }, {
      n_ctx: manifest.n_ctx,
      progressCallback: ({ loaded, total }) => {
        const pct = total ? Math.round((loaded / total) * 100) : 0;
        $('fill').style.width = pct + '%';
        $('status').textContent = pct < 100 ? `Downloading… ${pct}%` : 'Starting up…';
      },
    });
    ready = true;
    $('loadcard').classList.add('hidden');
    document.querySelectorAll('.chip').forEach((c) => (c.disabled = false));
    $('input').disabled = false;
    updateSend();
    $('input').focus();
  } catch (e) {
    console.error(e);
    $('status').innerHTML = '<span class="err">Couldn’t load the model. Try refreshing.</span>';
    $('load').textContent = 'Retry';
    $('load').disabled = false;
  }
}

function showThread() {
  $('hero').classList.add('hidden');
  $('thread').classList.remove('hidden');
}

function addTurn(role, text) {
  showThread();
  const turn = document.createElement('div');
  turn.className = 'turn ' + role;
  if (role === 'bot') {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '🍌';
    turn.appendChild(av);
  }
  const t = document.createElement('div');
  t.className = 'text';
  t.textContent = text;
  turn.appendChild(t);
  $('thread').appendChild(turn);
  scroll();
  return t;
}
const scroll = () => { $('main').scrollTop = $('main').scrollHeight; };

// keep the conversation short enough to fit the model's memory
function trimmedHistory() {
  const budget = manifest.n_ctx * 2.4;
  const out = [];
  let size = 0;
  for (let i = history.length - 1; i >= 0; i--) {
    size += history[i].content.length + 20;
    if (size > budget && out.length) break;
    out.unshift(history[i]);
  }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

function setBusy(b) {
  busy = b;
  $('icon-send').classList.toggle('hidden', b);
  $('icon-stop').classList.toggle('hidden', !b);
  $('send').setAttribute('aria-label', b ? 'Stop' : 'Send');
  updateSend();
}
function updateSend() {
  $('send').disabled = !ready || (!busy && !$('input').value.trim());
}

async function send(text) {
  setBusy(true);
  addTurn('user', text);
  history.push({ role: 'user', content: text });
  const out = addTurn('bot', '');
  out.innerHTML = '<span class="dot"></span>';
  let reply = '';
  abort = new AbortController();
  try {
    await wllama.createChatCompletion({
      messages: trimmedHistory(),
      max_tokens: 220,
      temp: 0.7, top_k: 40, top_p: 0.9, min_p: 0.05,
      penalty_repeat: 1.1, penalty_last_n: 64,
      stream: true,
      abortSignal: abort.signal,
      onData: (chunk) => {
        const piece = chunk.choices?.[0]?.delta?.content;
        if (piece) {
          reply += piece;
          out.textContent = reply;
          scroll();
        }
      },
    });
  } catch (e) {
    if (e?.name !== 'AbortError') console.error(e);
  }
  reply = reply.trim() || '…';
  out.textContent = reply;
  history.push({ role: 'assistant', content: reply });
  abort = null;
  setBusy(false);
}

function submit(text) {
  if (!ready || busy || !text) return;
  $('input').value = '';
  $('input').style.height = '';
  updateSend();
  send(text);
}

$('load').addEventListener('click', load);
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy) { abort?.abort(); return; }
  submit($('input').value.trim());
});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
$('input').addEventListener('input', () => {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 200) + 'px';
  updateSend();
});
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => submit(c.textContent)));
$('newchat').addEventListener('click', () => {
  if (busy) abort?.abort();
  history = [];
  $('thread').innerHTML = '';
  $('thread').classList.add('hidden');
  $('hero').classList.remove('hidden');
});

init();
</script>
</body>
</html>
