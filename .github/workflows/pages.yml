name: "4. Website (BananaGPT chat page)"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["2. Training round"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download newest model
        run: |
          pip install -q numpy
          gh release download latest -p BananaGPT-Q8_0.gguf -D .
          gh release view latest --json name --jq .name > label.txt
          cat label.txt
      - name: Build site
        run: bash scripts/build_site.sh BananaGPT-Q8_0.gguf "$(sed 's/BananaGPT 🍌 //' label.txt)" _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
