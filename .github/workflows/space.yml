name: "5. Cloud server (Hugging Face Space)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deploy newest model to the Space
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN secret is missing"; exit 1; fi
          pip install -q huggingface_hub==0.26.2
          TITLE=$(gh release view latest --json name --jq .name)
          case "$TITLE" in *polish*|*final*) CTX=2048;; *) CTX=1024;; esac
          echo "Model: $TITLE (context $CTX)"
          python scripts/deploy_space.py "$CTX"
