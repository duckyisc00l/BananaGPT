name: "2. Training round"

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Round number (starts at 0)"
        required: true
      rounds:
        description: "Total rounds"
        default: "48"
      workers:
        description: "Machines per round"
        default: "8"
      minutes:
        description: "Training minutes per round"
        default: "50"
      phase:
        description: "main or polish"
        default: "main"

permissions:
  contents: write
  actions: write

concurrency:
  group: bananagpt-training
  cancel-in-progress: false

run-name: "${{ inputs.phase == 'polish' && 'Polish' || 'Training' }} round ${{ inputs.round }} (of ${{ inputs.rounds }}, counting from 0)"

env:
  # polish rounds: longer memory (2048), smaller micro-batches to fit, gentler learning rate
  BANANA_CTX: ${{ inputs.phase == 'polish' && '2048' || '' }}
  MICRO: ${{ inputs.phase == 'polish' && '2' || '4' }}
  ACCUM: ${{ inputs.phase == 'polish' && '4' || '2' }}
  LR: ${{ inputs.phase == 'polish' && '0.0001' || '0.0004' }}
  # polish: 40% of each batch is the original training data, so it doesn't forget what it learned
  REPLAY_FRAC: ${{ inputs.phase == 'polish' && '0.4' || '0' }}
  DATA_TAG: ${{ inputs.phase == 'polish' && 'polish' || 'data' }}
  LABEL: ${{ inputs.phase == 'polish' && 'Polish round' || 'Round' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.w.outputs.list }}
    steps:
      - id: w
        run: python3 -c "import json;print('list='+json.dumps(list(range(int('${{ inputs.workers }}')))))" >> "$GITHUB_OUTPUT"

  train:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.setup.outputs.workers) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download data and weights
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i*30)); done; return 1; }
          mkdir -p work
          retry gh release download "$DATA_TAG" -p train.bin -D work
          retry gh release download data -p tokenizer.tgz -D work
          retry gh release download state -p global.pt -D work
          if [ "${{ inputs.phase }}" = "polish" ]; then retry gh release download data -p train.bin -O work/replay.bin; fi
          tar xzf work/tokenizer.tgz -C work
      - name: Train
        run: |
          python scripts/train_worker.py --work work --round ${{ inputs.round }} --rounds ${{ inputs.rounds }} \
            --worker ${{ matrix.worker }} --minutes ${{ inputs.minutes }} --lr "$LR" --out delta.pt \
            --replay work/replay.bin
      # Saving the worker's result: retry up to 3 times if GitHub storage glitches
      - id: up1
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: delta-${{ matrix.worker }}
          path: |
            delta.pt
            delta.pt.json
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Wait before retry
        if: steps.up1.outcome == 'failure'
        run: sleep 120
      - id: up2
        if: steps.up1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: delta-${{ matrix.worker }}
          path: |
            delta.pt
            delta.pt.json
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Wait before last retry
        if: steps.up1.outcome == 'failure' && steps.up2.outcome == 'failure'
        run: sleep 300
      - if: steps.up1.outcome == 'failure' && steps.up2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ matrix.worker }}
          path: |
            delta.pt
            delta.pt.json
          retention-days: 1
          compression-level: 0
          overwrite: true

  merge:
    needs: train
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - id: dl1
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: delta-*
          path: deltas
      - if: steps.dl1.outcome == 'failure'
        run: sleep 120
      - if: steps.dl1.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: delta-*
          path: deltas
      - name: Download state
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i*30)); done; return 1; }
          mkdir -p work
          retry gh release download data -p val.bin -p tokenizer.tgz -D work
          retry gh release download state -p global.pt -p history.json -D work
          gh release download state -p mom.pt -D work || echo "no momentum yet (first round of this phase)"
          tar xzf work/tokenizer.tgz -C work
      - name: Merge and evaluate
        run: python scripts/merge.py --work work --deltas deltas --round ${{ inputs.round }} --export export --label "$LABEL"
      - name: Save state
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i*30)); done; return 1; }
          retry gh release upload state work/global.pt work/mom.pt work/history.json --clobber
      - name: Start next round
        run: |
          NEXT=$(( ${{ inputs.round }} + 1 ))
          if [ -f STOP ]; then echo "STOP file found, not continuing"; exit 0; fi
          if [ "$NEXT" -lt "${{ inputs.rounds }}" ]; then
            gh workflow run round.yml -f round=$NEXT -f rounds=${{ inputs.rounds }} -f workers=${{ inputs.workers }} \
              -f minutes=${{ inputs.minutes }} -f phase=${{ inputs.phase }}
          elif [ "${{ inputs.phase }}" = "main" ]; then
            echo "Main training done! Starting the polish rounds."
            gh workflow run polish.yml -f workers=${{ inputs.workers }} -f minutes=${{ inputs.minutes }}
          else
            echo "All done!"
          fi
      - name: Quiz
        continue-on-error: true
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i*30)); done; return 1; }
          python scripts/quiz.py --model export --work work
          retry gh release upload state work/history.json --clobber
      - name: Convert to GGUF
        run: Q8_OUT=BananaGPT-Q8_0.gguf bash scripts/export_gguf.sh export BananaGPT.gguf
      - name: Publish model
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i*30)); done; return 1; }
          retry gh release upload latest BananaGPT.gguf BananaGPT-Q8_0.gguf --clobber
          R=$(( ${{ inputs.round }} + 1 ))
          if [ "${{ inputs.phase }}" = "polish" ]; then
            if [ "$R" -ge "${{ inputs.rounds }}" ]; then TITLE="BananaGPT 🍌 (final)"; else TITLE="BananaGPT 🍌 (polish round $R of ${{ inputs.rounds }})"; fi
          else
            TITLE="BananaGPT 🍌 (after round $R of ${{ inputs.rounds }})"
          fi
          gh release edit latest --title "$TITLE" --notes-file work/progress.md
          # update the website with the new model
          gh workflow run pages.yml || echo "could not start website update"
